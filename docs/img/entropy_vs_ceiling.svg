" fill="#64748B" font-size="13.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" >9 species</text><rect x="150" y="282" width="512" height="20" rx="4" fill="#D9F99D"/><rect x="150" y="308" width="275" height="20" rx="4" fill="#166534"/><text x="671.84" y="298" fill="#64748B" font-size="14" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" >ceiling 0.640</text><text x="434.96" y="324" fill="#0F172A" font-size="14" font-weight="600" font-family="Segoe UI,Helvetica,Arial,sans-serif" >0.344  (54% of the ceiling)</text>
<text x="976" y="370" fill="#94A3B8" font-size="12.5" font-weight="400" font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">ceiling = best entropy possible with that many species</text>
</svg>